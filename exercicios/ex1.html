<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercicio 1 tabela</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Tabela</h1>
    </header>
    <main>
        <table border="1" style="width: 100%;">
            <thead>
                <tr>
                    <th colspan="5">Tabela de Serviços Mecânicos</th>
                </tr>
            </thead>
            <tbody>
                <tr style="text-align: center;">
                    <td rowspan="5" style="background-color: rgb(8, 101, 89);"><b>Nacionais</b></td>
                    <td>Veículos</td>
                    <td>Serviço</td>
                    <td>Tempo Previsto</td>
                    <td>Valor</td>
                </tr>
                <tr style="text-align: center;">
                    <td>Caminhonete S10</td>
                    <td>Suspensão</td>
                    <td>3 horas e 25 minutos</td>
                    <td style="text-align: right;">350,00</td>
                </tr>
                <tr style="text-align: center;">
                    <td>Caminhonete Ranger</td>
                    <td>Freio</td>
                    <td>3 horas e 45 minutos</td>
                    <td style="text-align: right;">200,00</td>
                </tr>
                <tr style="text-align: center;">
                    <td>Caminhonete Hilux</td>
                    <td>Troca de Bateria</td>
                    <td>30 minutos</td>
                    <td style="text-align: right;">25,00</td>
                </tr>
                <tr style="text-align: center;">
                    <td>Caminhonete D10</td>
                    <td>Alinhamento</td>
                    <td>1 hora e 40 minutos</td>
                    <td style="text-align: right;">220,00</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
